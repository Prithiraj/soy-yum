name: Import verified website source
on:
  push:
    paths: [.github/workflows/import-source.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct and verify tested source files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import base64,hashlib,io,json,os,pathlib,tarfile,urllib.request,zlib
          chunks=['d1400d4f6efe5c21c3a64c2fac0a7771842bed3f','74547521190ca387817db74a5662762316b961d3','03a73595656f90dafca8879ed27b73f5a11ecd9e','d9639ec6b7cb909e3f0b3b24fa294f0016092898','33ed5c8d5ea56dd0e4c8201639d41ddd681caa90']
          expected={
            'README.md':'9a73adcd8160fe8738fa9886f7fa8840e6a632406ff3098da6ab0afad4e5f437',
            '.gitignore':'dd6155b836e3baf705ac009ae5c78e222df5a4ee3ea53605f8dd120291865dc1',
            'requirements.txt':'570c9387510a35edf1e287600993944ebc8ee5af602c809cf00cd57e2b723779',
            'assets/app.js':'bf0b16b81bf78607b978674327ca4ad71911ed6c37fc30f68d4381418a5f6e1f',
            'assets/favicon.svg':'a6d2de8c770a3115361aa925e2e1c912b9aedc6a7ef054da0d3ee306ffcbb8a0',
            'assets/style.css':'7fe4cf4c31085b160d756fe3116edd73df9892ac869002fb19fdd44b5ec70f26',
            'content/menu.json':'592c0b34c01dd72fab468164209c08ca33f5c8a5e1808dac96950fecdf15e8d0',
            'content/photos.json':'2167c45f7ec393e6249d2bec5e0d966f629d6b684c15896f6044b27ece645561',
            'content/site.json':'9c08cfbdf4600c7345c0ed1b2b6694deccbd694cbc6beb3a6e40278c6c71e2fa',
            'src/404.html':'9b831caedd2f1ae8636e5708268da2eaa0b373e1803896b476717d276eefe83b',
            'src/credits.html':'ac5c02f680bc8881b039a31817742515c41dfb974cde24cfee1a84ea63f8aad5',
            'src/index.html':'d3d4506e3aa06dc8107ef876cb2c62f10e2a98e549e334ed71a14d5782fb5dfb',
            'src/menu.html':'2dd1e73c2dfddf13b29587170704d0ce27090d5a0a77b439bfc10a2a01e08af6',
            'src/partials/footer.html':'76b6710dbf3ce9da563a4a651ffe3cded99d793cd0b4605a9186795d1842d557',
            'src/partials/head.html':'7db7dbffacc7033ba02f58635ae6e57742824fa02e23b3a8e24590649efd064d',
            'src/partials/header.html':'1e6a71bba8d80f8378ba0e9c8406c2085521e9d5119e5a00003566e210064a5c',
            'scripts/build.py':'9c0603e12a2c5ba3700608a4044807b25dca42c15e84b17e4356a4cdab190c78',
            'tests/browser.py':'f72df23920f994c6da0378da0854c4f94584422fa92570815b51bac68e78ab11'}
          data=b''
          for sha in chunks:
            request=urllib.request.Request('https://api.github.com/repos/Prithiraj/soy-yum/git/blobs/'+sha,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
            with urllib.request.urlopen(request,timeout=30) as response: blob=json.load(response)
            part=base64.b64decode(blob['content'])
            assert hashlib.sha1(b'blob '+str(len(part)).encode()+b'\0'+part).hexdigest()==sha
            data+=part
          assert hashlib.sha256(data).hexdigest()=='938ebc2d6041a189801d9f1c25f6fc8842dc0cad2aed0c415a10326bced9f293'
          # Only the complete, explicitly manifested files in this transfer prefix are imported.
          raw=zlib.decompressobj(31).decompress(data)
          found=set()
          with tarfile.open(fileobj=io.BytesIO(raw),mode='r:') as archive:
            for member in archive:
              if member.name not in expected: break
              assert member.isfile() and member.size<100000
              content=archive.extractfile(member).read()
              assert hashlib.sha256(content).hexdigest()==expected[member.name],member.name
              destination=pathlib.Path(member.name)
              destination.parent.mkdir(parents=True,exist_ok=True)
              destination.write_bytes(content)
              found.add(member.name)
              print('VERIFIED',member.name)
              if found==set(expected): break
          assert found==set(expected)
          PY
      - name: Commit source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md .gitignore requirements.txt assets content src scripts tests/browser.py
          git commit -m "feat: implement vibrant photo-led Soy Yum website"
          git push origin HEAD:main
